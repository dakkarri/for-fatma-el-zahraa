<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0c060f">
<title>🌹 فاطمه الزهراء</title>
<meta property="og:title" content="🌹 فاطمه الزهراء">
<meta property="og:type" content="website">
<meta property="og:image" content="https://dakkarri.github.io/for-fatma-el-zahraa/preview.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
    overflow: hidden;
    background: #0c060f;
    font-family: 'Aref Ruqaa', 'Amiri', serif;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
}
/* ---------- sky ---------- */
.sky {
    position: fixed; inset: 0;
    background:
        radial-gradient(130% 70% at 78% -8%, #2a1030 0%, transparent 55%),
        radial-gradient(120% 80% at 15% 110%, #160a1e 0%, transparent 60%),
        linear-gradient(180deg, #07040c 0%, #120718 42%, #1c0b1e 74%, #120714 100%);
}
.stars { position: fixed; inset: 0; overflow: hidden; }
.star {
    position: absolute;
    background: #fff0f6;
    border-radius: 50%;
    animation: twinkle var(--td, 4s) ease-in-out var(--tdel, 0s) infinite alternate;
}
@keyframes twinkle {
    from { opacity: .18; transform: scale(.7); }
    to   { opacity: .95; transform: scale(1.15); }
}
.shooting {
    position: fixed; top: 12%; left: -15%;
    width: 130px; height: 2px; border-radius: 2px;
    background: linear-gradient(90deg, rgba(255,240,248,.95), transparent);
    filter: drop-shadow(0 0 6px rgba(255,220,240,.8));
    transform: rotate(-24deg);
    opacity: 0;
    animation: shoot 11s linear 7s infinite;
    pointer-events: none;
}
@keyframes shoot {
    0%   { opacity: 0; transform: rotate(-24deg) translateX(0); }
    2%   { opacity: 1; }
    7%   { opacity: 0; transform: rotate(-24deg) translateX(130vw); }
    100% { opacity: 0; transform: rotate(-24deg) translateX(130vw); }
}
/* ---------- moon ---------- */
.moon {
    position: fixed; top: 6.5%; left: 12%;
    width: 72px; height: 72px; border-radius: 50%;
    background: radial-gradient(circle at 38% 36%, #fff8ea 0%, #f7e3bd 55%, #e8c892 100%);
    opacity: 0;
    animation: moonin 2.4s ease .3s forwards;
}
.moon::before {
    content: ""; position: absolute; left: 50%; top: 50%;
    width: 300px; height: 300px; border-radius: 50%;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(247,222,170,.30) 0%, rgba(247,222,170,.13) 32%, rgba(247,222,170,.05) 52%, transparent 72%);
    animation: moonbreathe 9s ease-in-out 2.8s infinite alternate;
    z-index: -1;
}
.moon::after {
    content: ""; position: absolute; top: -6%; left: 22%;
    width: 100%; height: 100%; border-radius: 50%;
    background: radial-gradient(circle at 40% 40%, #170a1c 0%, #0e0612 70%);
}
@keyframes moonin { to { opacity: 1; } }
@keyframes moonbreathe {
    from { opacity: .75; transform: translate(-50%,-50%) scale(1); }
    to   { opacity: 1; transform: translate(-50%,-50%) scale(1.08); }
}
/* ---------- ground mist ---------- */
.mist {
    position: fixed; left: -20%; right: -20%; bottom: -12%;
    height: 34%;
    background: radial-gradient(60% 100% at 50% 100%, rgba(90, 30, 70, .5) 0%, transparent 75%);
    filter: blur(2px);
    animation: mistmove 14s ease-in-out infinite alternate;
    pointer-events: none;
}
@keyframes mistmove {
    from { transform: translateX(-2.5%) scaleY(1); }
    to   { transform: translateX(2.5%) scaleY(1.12); }
}
/* ---------- glow behind flower ---------- */
.glow {
    position: fixed; left: 50%; top: 34%;
    width: 80vmin; height: 80vmin;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 96, 140, .30) 0%, rgba(255, 96, 140, .10) 42%, transparent 68%);
    opacity: 0;
    transition: opacity 2.6s ease;
    pointer-events: none;
}
.glow.on { opacity: 1; animation: glowpulse 6s ease-in-out 2.6s infinite alternate; }
@keyframes glowpulse {
    from { transform: translate(-50%,-50%) scale(1); opacity: .85; }
    to   { transform: translate(-50%,-50%) scale(1.12); opacity: 1; }
}
/* ---------- stage ---------- */
.stage {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: flex-end;
    padding-bottom: 4vh;
    opacity: 0;
    animation: scenein 1.6s ease .1s forwards;
}
@keyframes scenein { to { opacity: 1; } }
.rose-svg {
    width: min(100vw, 62vh);
    height: auto;
    display: block;
    overflow: visible;
}
/* gentle sway of the whole plant after bloom */
.sway {
    transform-box: view-box;
    transform-origin: 50% 92%;
    animation: sway 8.5s ease-in-out 7s infinite alternate;
}
@keyframes sway {
    from { transform: rotate(-1.15deg); }
    to   { transform: rotate(1.15deg); }
}
/* stem draws itself */
.stem {
    stroke-dasharray: 100;
    stroke-dashoffset: 100;
    animation: stemdraw 1.7s cubic-bezier(.4,0,.3,1) .55s forwards;
}
@keyframes stemdraw { to { stroke-dashoffset: 0; } }
/* leaves unfurl */
.leaf-in {
    transform-box: fill-box;
    animation: leafpop 1.1s cubic-bezier(.3,1.5,.4,1) both;
}
.leaf-l .leaf-in { transform-origin: 100% 55%; animation-delay: 1.35s; }
.leaf-r .leaf-in { transform-origin: 0% 55%;  animation-delay: 1.7s; }
@keyframes leafpop {
    from { transform: scale(.05) rotate(-14deg); opacity: 0; }
    60%  { opacity: 1; }
    to   { transform: scale(1) rotate(0deg); opacity: 1; }
}
/* petals / sepals: scale + unfurl around their own base */
.petal, .sepal {
    transform-box: fill-box;
    transform-origin: 50% 100%;
    opacity: 0;
    animation: bloom 1.35s cubic-bezier(.28,1.25,.35,1) var(--d, 2s) both;
}
@keyframes bloom {
    0%   { transform: scale(.02) rotate(-14deg); opacity: 0; }
    12%  { opacity: 1; }
    58%  { transform: scale(1.08) rotate(2.5deg); }
    78%  { transform: scale(.975) rotate(-1deg); }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
}
.dew {
    transform-box: fill-box;
    transform-origin: 50% 50%;
    opacity: 0;
    animation: dewin .8s ease var(--d, 4s) both;
}
@keyframes dewin { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.centerpiece {
    transform-box: fill-box;
    transform-origin: 50% 50%;
    opacity: 0;
    animation: corein 1.1s cubic-bezier(.3,1.6,.4,1) 4.5s both;
}
@keyframes corein {
    from { transform: scale(.05); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
}
/* ---------- name ---------- */
.name-wrap { margin-top: -7vh; text-align: center; position: relative; z-index: 3; }
.name {
    font-weight: 700;
    font-size: clamp(2.5rem, 10.5vw, 4.2rem);
    line-height: 1.35;
    filter: drop-shadow(0 0 14px rgba(243, 205, 130, .45)) drop-shadow(0 2px 10px rgba(0,0,0,.55));
}
.name .w {
    display: inline-block;
    background: linear-gradient(160deg, #fff2cf 0%, #f3cf87 34%, #dfa94f 58%, #f7dfa4 82%, #c98f35 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    opacity: 0;
    transform: translateY(26px);
    filter: blur(10px);
    animation: wordin 1.5s cubic-bezier(.2,.8,.25,1) forwards;
}
.name .w1 { animation-delay: 5.1s; }
.name .w2 { animation-delay: 5.75s; }
@keyframes wordin {
    to { opacity: 1; transform: translateY(0); filter: blur(0); }
}
.flourish {
    margin: .6vh auto 0;
    width: 0;
    height: 2px; border-radius: 2px;
    background: linear-gradient(90deg, transparent, #e9c579 18%, #f9e7bd 50%, #e9c579 82%, transparent);
    box-shadow: 0 0 10px rgba(243,205,130,.55);
    animation: linein 1.3s ease 6.7s forwards;
    position: relative;
}
@keyframes linein { to { width: min(58vw, 300px); } }
.flourish::after {
    content: "✦";
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -52%) scale(0);
    color: #f7dfa4; font-size: 15px;
    text-shadow: 0 0 10px rgba(247,223,164,.9);
    animation: starin .7s cubic-bezier(.3,1.6,.4,1) 7.7s forwards;
}
@keyframes starin { to { transform: translate(-50%,-52%) scale(1); } }
/* ---------- ambient particles ---------- */
.fly {
    position: fixed;
    width: 5px; height: 5px; border-radius: 50%;
    background: radial-gradient(circle, #ffe9b0 0%, rgba(255,214,140,.55) 45%, transparent 75%);
    filter: blur(.4px);
    animation: flydrift var(--fd, 9s) ease-in-out var(--fdel, 0s) infinite alternate;
    opacity: 0;
    pointer-events: none;
}
@keyframes flydrift {
    0%   { opacity: 0; transform: translate(0,0); }
    18%  { opacity: .9; }
    82%  { opacity: .7; }
    100% { opacity: 0; transform: translate(var(--dx, 30px), var(--dy, -60px)); }
}
.dust {
    position: fixed;
    width: 3.5px; height: 3.5px; border-radius: 50%;
    background: radial-gradient(circle, #fff3d6 0%, rgba(255,230,170,.5) 55%, transparent 80%);
    animation: rise var(--rd, 6s) linear var(--rdel, 0s) infinite;
    opacity: 0;
    pointer-events: none;
}
@keyframes rise {
    0%   { opacity: 0; transform: translateY(0) scale(.6); }
    14%  { opacity: .95; }
    100% { opacity: 0; transform: translateY(-150px) scale(1.05); }
}
/* drifting petals after bloom */
.drift {
    position: fixed; top: -6vh;
    opacity: 0;
    animation: fall var(--dd, 12s) linear var(--ddel, 0s) infinite;
    pointer-events: none;
    z-index: 2;
}
.drift-i {
    width: var(--sz, 16px); height: calc(var(--sz, 16px) * 1.25);
    border-radius: 62% 62% 58% 58% / 74% 74% 40% 40%;
    background: linear-gradient(155deg, #ff9db6 0%, #e7517c 60%, #b41f49 100%);
    box-shadow: inset 0 -3px 6px rgba(90,5,35,.5), 0 0 8px rgba(255,120,160,.25);
    animation: driftSway calc(var(--dd, 12s) / 3) ease-in-out infinite alternate;
}
@keyframes fall {
    0%   { opacity: 0; transform: translateY(0) rotate(0deg); }
    6%   { opacity: .9; }
    92%  { opacity: .8; }
    100% { opacity: 0; transform: translateY(112vh) rotate(310deg); }
}
@keyframes driftSway {
    from { transform: translateX(-3.5vmin) rotate(-24deg); }
    to   { transform: translateX(3.5vmin) rotate(24deg); }
}
/* tap hearts */
.tap-heart { position: fixed; pointer-events: none; z-index: 5; animation: heartup 2.6s cubic-bezier(.2,.7,.3,1) forwards; }
@keyframes heartup {
    0%   { opacity: 0; transform: translate(-50%,-50%) scale(.3) rotate(0deg); }
    12%  { opacity: 1; }
    100% { opacity: 0; transform: translate(calc(-50% + var(--hx, 0px)), calc(-50% - 170px)) scale(1.15) rotate(var(--hr, 12deg)); }
}
/* golden spark burst */
.spark {
    position: fixed; width: 5px; height: 5px; border-radius: 50%;
    background: radial-gradient(circle, #fff6dd 0%, rgba(248,214,140,.85) 55%, transparent 85%);
    pointer-events: none; z-index: 4;
    animation: sparkfly .95s cubic-bezier(.1,.8,.3,1) forwards;
}
@keyframes sparkfly {
    0%   { opacity: 1; transform: translate(-50%,-50%) scale(.4); }
    100% { opacity: 0; transform: translate(calc(-50% + var(--sx)), calc(-50% + var(--sy))) scale(1.1); }
}
.vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 6;
    background: radial-gradient(120% 95% at 50% 42%, transparent 55%, rgba(5,2,8,.55) 100%);
}
/* ---------- reduced motion ---------- */
@media (prefers-reduced-motion: reduce) {
    .sway, .stars .star, .shooting, .moon, .mist, .fly, .dust, .drift, .drift-i, .glow { animation: none !important; }
    .moon { opacity: 1; }
    .stem { stroke-dashoffset: 0; animation: none; }
    .leaf-in { animation: none; }
    .petal, .sepal { animation: none; opacity: 1; }
    .dew, .centerpiece { animation: none; opacity: 1; }
    .stage { animation: none; opacity: 1; }
    .name .w { animation: none; opacity: 1; transform: none; filter: none; }
    .flourish { animation: none; width: min(58vw, 300px); }
    .flourish::after { animation: none; transform: translate(-50%,-52%) scale(1); }
    .glow.on { opacity: 1; }
}
</style>
</head>
<body>
<div class="sky"></div>
<div class="stars" id="stars"></div>
<div class="shooting"></div>
<div class="moon"></div>
<div class="mist"></div>
<div class="glow" id="glow"></div>

<div class="stage">
<svg class="rose-svg" viewBox="250 170 500 780" xmlns="http://www.w3.org/2000/svg" aria-label="وردة">
  <defs>
    <!-- petal gradients: velvety crimson to blush -->
    <radialGradient id="g1" cx="50%" cy="12%" r="95%">
      <stop offset="0%" stop-color="#e0486c"/><stop offset="42%" stop-color="#b91c46"/>
      <stop offset="80%" stop-color="#8a0f31"/><stop offset="100%" stop-color="#59071e"/>
    </radialGradient>
    <radialGradient id="g2" cx="50%" cy="12%" r="95%">
      <stop offset="0%" stop-color="#ee6288"/><stop offset="46%" stop-color="#cd2a54"/>
      <stop offset="100%" stop-color="#74102c"/>
    </radialGradient>
    <radialGradient id="g3" cx="50%" cy="12%" r="95%">
      <stop offset="0%" stop-color="#f782a4"/><stop offset="50%" stop-color="#dd4169"/>
      <stop offset="100%" stop-color="#8f1436"/>
    </radialGradient>
    <radialGradient id="g4" cx="50%" cy="12%" r="95%">
      <stop offset="0%" stop-color="#ffa6bd"/><stop offset="55%" stop-color="#f0678f"/>
      <stop offset="100%" stop-color="#ab1f49"/>
    </radialGradient>
    <radialGradient id="g5" cx="50%" cy="15%" r="95%">
      <stop offset="0%" stop-color="#ffc9d6"/><stop offset="60%" stop-color="#ff92af"/>
      <stop offset="100%" stop-color="#cf3862"/>
    </radialGradient>
    <linearGradient id="cg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe3ec"/><stop offset="100%" stop-color="#ff9ebb"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#ffe3ea"/><stop offset="55%" stop-color="#ffb1c4"/>
      <stop offset="100%" stop-color="#e05a82"/>
    </radialGradient>
    <linearGradient id="sg" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#1d4426"/><stop offset="100%" stop-color="#4c8a54"/>
    </linearGradient>
    <linearGradient id="stemg" gradientUnits="userSpaceOnUse" x1="500" y1="430" x2="500" y2="895">
      <stop offset="0%" stop-color="#3c7a49"/><stop offset="100%" stop-color="#16391f"/>
    </linearGradient>
    <radialGradient id="lg" cx="60%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#5b9e63"/><stop offset="100%" stop-color="#1f4a29"/>
    </radialGradient>
    <!-- outer guard petal: wider, flatter, open lip -->
    <g id="p-outer">
      <path d="M0,0 C-54,-4 -66,-42 -42,-74 C-28,-94 28,-94 42,-74 C66,-42 54,-4 0,0 Z"
            fill="url(#g1)" stroke="rgba(70,2,22,.4)" stroke-width="1.2"/>
      <path d="M0,-12 C-13,-30 -22,-50 -28,-66 M0,-12 C13,-30 22,-50 28,-66"
            fill="none" stroke="rgba(94,7,24,.28)" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M-42,-74 C-28,-94 28,-94 42,-74 C28,-88 -28,-88 -42,-74 Z" fill="url(#cg)" opacity=".5"/>
    </g>
    <g id="p2">
      <path d="M0,0 C-44,-6 -58,-50 -36,-84 C-24,-103 24,-103 36,-84 C58,-50 44,-6 0,0 Z"
            fill="url(#g2)" stroke="rgba(90,4,26,.32)" stroke-width="1.1"/>
    </g>
    <g id="p3">
      <path d="M0,0 C-44,-6 -58,-50 -36,-84 C-24,-103 24,-103 36,-84 C58,-50 44,-6 0,0 Z"
            fill="url(#g3)" stroke="rgba(110,8,32,.28)" stroke-width="1"/>
    </g>
    <g id="p4">
      <path d="M0,0 C-44,-6 -58,-50 -36,-84 C-24,-103 24,-103 36,-84 C58,-50 44,-6 0,0 Z"
            fill="url(#g4)" stroke="rgba(130,14,40,.24)" stroke-width="1"/>
    </g>
    <g id="p5">
      <path d="M0,0 C-40,-6 -50,-44 -32,-74 C-21,-91 21,-91 32,-74 C50,-44 40,-6 0,0 Z"
            fill="url(#g5)" stroke="rgba(150,24,52,.2)" stroke-width="1"/>
    </g>
    <path id="sepal" d="M0,0 C-9,-22 -8,-48 0,-68 C8,-48 9,-22 0,0 Z"
          fill="url(#sg)" stroke="rgba(10,30,14,.5)" stroke-width="1"/>
  </defs>

  <g class="sway">
    <!-- stem -->
    <path class="stem" pathLength="100"
          d="M500,436 C493,500 507,565 499,635 C493,705 505,780 500,892"
          fill="none" stroke="url(#stemg)" stroke-width="9" stroke-linecap="round"/>
    <!-- left leaf -->
    <g class="leaf-l" transform="translate(498,600)">
      <g class="leaf-in">
        <path d="M0,0 C-32,-26 -78,-30 -112,-6 C-80,16 -34,16 0,0 Z" fill="url(#lg)" stroke="rgba(10,32,15,.45)" stroke-width="1.2"/>
        <path d="M-8,-2 L-96,-4 M-30,-3 L-44,-14 M-52,-4 L-66,-14 M-30,-2 L-42,8 M-54,-3 L-66,6"
              fill="none" stroke="rgba(14,40,18,.5)" stroke-width="1.4" stroke-linecap="round"/>
      </g>
    </g>
    <!-- right leaf -->
    <g class="leaf-r" transform="translate(500,700)">
      <g class="leaf-in">
        <path d="M0,0 C34,-22 82,-22 114,4 C80,20 34,16 0,0 Z" fill="url(#lg)" stroke="rgba(10,32,15,.45)" stroke-width="1.2"/>
        <path d="M8,-1 L98,3 M30,0 L45,-11 M54,1 L69,-8 M30,1 L43,10 M56,2 L68,10"
              fill="none" stroke="rgba(14,40,18,.5)" stroke-width="1.4" stroke-linecap="round"/>
      </g>
    </g>

    <!-- sepals -->
    <g transform="translate(500 440) rotate(36) scale(1.0)"><use href="#sepal" class="sepal" style="--d:1.55s"/></g>
    <g transform="translate(500 440) rotate(108) scale(1.05)"><use href="#sepal" class="sepal" style="--d:1.62s"/></g>
    <g transform="translate(500 440) rotate(180) scale(.95)"><use href="#sepal" class="sepal" style="--d:1.69s"/></g>
    <g transform="translate(500 440) rotate(252) scale(1.05)"><use href="#sepal" class="sepal" style="--d:1.76s"/></g>
    <g transform="translate(500 440) rotate(324) scale(1.0)"><use href="#sepal" class="sepal" style="--d:1.83s"/></g>

    <!-- layer 1: outer guard petals -->
    <g transform="translate(500 440) rotate(5) scale(1.6)"><use href="#p-outer" class="petal" style="--d:2.05s"/></g>
    <g transform="translate(500 440) rotate(77) scale(1.55)"><use href="#p-outer" class="petal" style="--d:2.15s"/></g>
    <g transform="translate(500 440) rotate(149) scale(1.62)"><use href="#p-outer" class="petal" style="--d:2.25s"/></g>
    <g transform="translate(500 440) rotate(221) scale(1.56)"><use href="#p-outer" class="petal" style="--d:2.35s"/></g>
    <g transform="translate(500 440) rotate(293) scale(1.6)"><use href="#p-outer" class="petal" style="--d:2.45s"/></g>
    <!-- dew on outer petals -->
    <g transform="translate(500 440) rotate(77) scale(1.55)"><circle class="dew" cx="16" cy="-56" r="3.1" fill="rgba(255,255,255,.55)" style="--d:3.9s"/></g>
    <g transform="translate(500 440) rotate(293) scale(1.6)"><circle class="dew" cx="-12" cy="-44" r="2.2" fill="rgba(255,255,255,.45)" style="--d:4.1s"/></g>
    <g transform="translate(500 440) rotate(5) scale(1.6)"><circle class="dew" cx="20" cy="-38" r="1.7" fill="rgba(255,255,255,.5)" style="--d:4.25s"/></g>

    <!-- layer 2 -->
    <g transform="translate(500 440) rotate(41) scale(1.3)"><use href="#p2" class="petal" style="--d:2.6s"/></g>
    <g transform="translate(500 440) rotate(113) scale(1.26)"><use href="#p2" class="petal" style="--d:2.7s"/></g>
    <g transform="translate(500 440) rotate(185) scale(1.32)"><use href="#p2" class="petal" style="--d:2.8s"/></g>
    <g transform="translate(500 440) rotate(257) scale(1.26)"><use href="#p2" class="petal" style="--d:2.9s"/></g>
    <g transform="translate(500 440) rotate(329) scale(1.28)"><use href="#p2" class="petal" style="--d:3.0s"/></g>
    <!-- layer 3 -->
    <g transform="translate(500 440) rotate(15) scale(1.0)"><use href="#p3" class="petal" style="--d:3.14s"/></g>
    <g transform="translate(500 440) rotate(105) scale(.97)"><use href="#p3" class="petal" style="--d:3.26s"/></g>
    <g transform="translate(500 440) rotate(195) scale(1.01)"><use href="#p3" class="petal" style="--d:3.38s"/></g>
    <g transform="translate(500 440) rotate(285) scale(.97)"><use href="#p3" class="petal" style="--d:3.5s"/></g>
    <!-- layer 4 -->
    <g transform="translate(500 440) rotate(60) scale(.74)"><use href="#p4" class="petal" style="--d:3.64s"/></g>
    <g transform="translate(500 440) rotate(150) scale(.72)"><use href="#p4" class="petal" style="--d:3.76s"/></g>
    <g transform="translate(500 440) rotate(240) scale(.75)"><use href="#p4" class="petal" style="--d:3.88s"/></g>
    <g transform="translate(500 440) rotate(330) scale(.72)"><use href="#p4" class="petal" style="--d:4.0s"/></g>
    <!-- layer 5: inner cup -->
    <g transform="translate(500 440) rotate(30) scale(.52)"><use href="#p5" class="petal" style="--d:4.12s"/></g>
    <g transform="translate(500 440) rotate(150) scale(.5)"><use href="#p5" class="petal" style="--d:4.22s"/></g>
    <g transform="translate(500 440) rotate(270) scale(.52)"><use href="#p5" class="petal" style="--d:4.32s"/></g>
    <!-- spiral heart of the rose -->
    <g class="centerpiece">
      <circle cx="500" cy="440" r="23" fill="url(#core)"/>
      <path d="M500,422 C515,422 524,433 522,446 C520,459 507,466 496,461 C485,456 481,445 486,435 C490,427 500,425 507,429 C512,433 514,440 509,444 C506,448 500,448 497,445"
            fill="none" stroke="#c23a60" stroke-width="2.4" stroke-linecap="round" opacity=".85"/>
    </g>
  </g>
</svg>

<div class="name-wrap">
  <div class="name"><span class="w w1">فاطمه</span> <span class="w w2">الزهراء</span></div>
  <div class="flourish"></div>
</div>
</div>

<div class="vignette"></div>

<script>
(function () {
  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // stars
  var stars = document.getElementById('stars');
  for (var i = 0; i < 95; i++) {
    var s = document.createElement('span');
    s.className = 'star';
    var sz = (Math.random() * 1.7 + 0.7).toFixed(1);
    s.style.width = s.style.height = sz + 'px';
    s.style.left = (Math.random() * 100).toFixed(2) + '%';
    s.style.top = (Math.random() * 62).toFixed(2) + '%';
    s.style.setProperty('--td', (2.6 + Math.random() * 3.4).toFixed(2) + 's');
    s.style.setProperty('--tdel', (Math.random() * 6).toFixed(2) + 's');
    stars.appendChild(s);
  }

  // fireflies
  for (var j = 0; j < 14; j++) {
    var f = document.createElement('span');
    f.className = 'fly';
    f.style.left = (8 + Math.random() * 84).toFixed(2) + '%';
    f.style.top = (22 + Math.random() * 62).toFixed(2) + '%';
    f.style.setProperty('--dx', ((Math.random() - .5) * 130).toFixed(0) + 'px');
    f.style.setProperty('--dy', (-30 - Math.random() * 90).toFixed(0) + 'px');
    f.style.setProperty('--fd', (7 + Math.random() * 6).toFixed(2) + 's');
    f.style.setProperty('--fdel', (4 + Math.random() * 9).toFixed(2) + 's');
    document.body.appendChild(f);
  }

  // golden dust rising around the bloom
  for (var k = 0; k < 12; k++) {
    var d = document.createElement('span');
    d.className = 'dust';
    d.style.left = (38 + Math.random() * 24).toFixed(2) + '%';
    d.style.top = (24 + Math.random() * 16).toFixed(2) + '%';
    d.style.setProperty('--rd', (4.5 + Math.random() * 4).toFixed(2) + 's');
    d.style.setProperty('--rdel', (5 + Math.random() * 8).toFixed(2) + 's');
    document.body.appendChild(d);
  }

  // petals drifting after the bloom
  for (var m = 0; m < 6; m++) {
    var w = document.createElement('div');
    w.className = 'drift';
    w.style.left = (4 + Math.random() * 90).toFixed(2) + '%';
    w.style.setProperty('--dd', (11 + Math.random() * 7).toFixed(2) + 's');
    w.style.setProperty('--ddel', (7.5 + m * 3.4 + Math.random() * 2).toFixed(2) + 's');
    w.style.setProperty('--sz', (12 + Math.random() * 9).toFixed(0) + 'px');
    var inner = document.createElement('div');
    inner.className = 'drift-i';
    w.appendChild(inner);
    document.body.appendChild(w);
  }

  var glow = document.getElementById('glow');

  function flowerCenter() {
    var svg = document.querySelector('.rose-svg');
    var r = svg.getBoundingClientRect();
    return {
      x: r.left + r.width * 0.5,
      y: r.top + r.height * ((440 - 170) / 780)
    };
  }

  function sparkBurst() {
    if (reduced) return;
    var c = flowerCenter();
    for (var n = 0; n < 16; n++) {
      var sp = document.createElement('span');
      sp.className = 'spark';
      var ang = (n / 16) * Math.PI * 2 + Math.random() * .4;
      var dist = 90 + Math.random() * 120;
      sp.style.left = c.x + 'px';
      sp.style.top = c.y + 'px';
      sp.style.setProperty('--sx', (Math.cos(ang) * dist).toFixed(0) + 'px');
      sp.style.setProperty('--sy', (Math.sin(ang) * dist).toFixed(0) + 'px');
      document.body.appendChild(sp);
      (function (el) { setTimeout(function () { el.remove(); }, 1100); })(sp);
    }
  }

  if (reduced) {
    glow.classList.add('on');
  } else {
    setTimeout(function () { glow.classList.add('on'); }, 3800);
    setTimeout(sparkBurst, 4700);
  }

  // tap -> hearts rise
  var HEART = '<svg width="30" height="27" viewBox="0 0 32 29"><path d="M16 27C2 18 0 9 4.5 4.8 8.4 1.2 13.4 2.6 16 7c2.6-4.4 7.6-5.8 11.5-2.2C32 9 30 18 16 27Z" fill="COLOR"/></svg>';
  var COLORS = ['#ff7ba0', '#ff9db6', '#f3cf87', '#e7517c', '#ffc9d6'];
  var liveHearts = 0;
  window.addEventListener('pointerdown', function (e) {
    if (reduced || liveHearts > 22) return;
    var count = 1 + Math.floor(Math.random() * 2);
    for (var h = 0; h < count; h++) {
      liveHearts++;
      var el = document.createElement('span');
      el.className = 'tap-heart';
      el.innerHTML = HEART.replace('COLOR', COLORS[Math.floor(Math.random() * COLORS.length)]);
      el.style.left = (e.clientX + (Math.random() - .5) * 36) + 'px';
      el.style.top = (e.clientY + (Math.random() - .5) * 20) + 'px';
      el.style.setProperty('--hx', ((Math.random() - .5) * 90).toFixed(0) + 'px');
      el.style.setProperty('--hr', ((Math.random() - .5) * 36).toFixed(0) + 'deg');
      document.body.appendChild(el);
      (function (node) {
        node.addEventListener('animationend', function () { node.remove(); liveHearts--; });
      })(el);
    }
  }, { passive: true });
})();
</script>
</body>
</html>
